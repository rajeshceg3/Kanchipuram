<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the sacred temples of Kanchipuram, a city of 1000 temples.">
    <meta property="og:title" content="Kanchipuram: A Contemplation of Form">
    <meta property="og:description" content="Explore the sacred temples of Kanchipuram, a city of 1000 temples.">
    <meta property="og:url" content="https://kanchipuram-temples.app">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#f4f1ea">

    <link rel="manifest" href="/manifest.json">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://unpkg.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://tiles.openfreemap.org; worker-src 'self' blob:;">
    <title>Kanchipuram: A Contemplation of Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>
    <a href="#temple-list" class="skip-link">Skip to main content</a>
    <div id="app-container">
        <div id="map" role="main" aria-label="Temple Map"></div>
        <header class="map-heading"><h1>Kanchipuram</h1><p>A contemplation of form</p></header>
        <button id="panel-toggle" class="panel-toggle collapsed" aria-label="Open temples" aria-controls="panel" aria-expanded="false">
            <span class="toggle-label">Temples</span><span aria-hidden="true">✦</span>
        </button>
        <div id="panel" class="hidden-mobile" role="complementary" aria-label="Temple List">
            <div class="panel-header">
                <div><h2>Six sacred places</h2><p>Choose a temple to read its story.</p></div>
                <button id="panel-close" type="button" aria-label="Close temples">×</button>
            </div>
            <div id="network-error-banner" class="network-error">Map service is currently unavailable.</div>
            <ul id="temple-list" tabindex="-1"></ul>
        </div>
    </div>
    <script type="module" src="/scripts/main.js"></script>
</body>
</html>
